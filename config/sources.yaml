# Fuentes de monitoreo. Agrega o quita entradas aquí sin tocar el código Python.
# "peso" = score de confiabilidad de la fuente (0.0 a 1.0) usado en la verificación cruzada.
# "region" (opcional) = estado (nombre canónico de config/estados.yaml) donde el medio
# está asentado. Solo se pone en medios claramente regionales/locales -- se usa para
# dar un pequeño bono al peso efectivo de la fuente SOLO cuando reporta sobre un evento
# en esa misma region (ver scripts/verify_ai.py, BONO_FUENTE_LOCAL).

