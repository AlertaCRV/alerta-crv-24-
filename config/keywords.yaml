    # "enfrentamiento"/"enfrentamientos" sola se evita a proposito (31-07-2026):
    # choca con dos usos idiomaticos frecuentes que no son disturbios civiles --
    # una disputa personal ("murio durante un enfrentamiento que sostuvo con un
    # vecino" por un pleito de tierras) y un operativo policial/militar
    # ("se registraron enfrentamientos con presuntos implicados" durante una
    # incautacion de droga). Se mantiene como evidencia fuerte en
    # _EVIDENCIA_FUERTE_POR_TIPO (classify.py) para no perder el caso real de
    # disturbios civiles genuinos que ademas la mencionen junto a otra palabra
    # de esta lista.
    # "manifestacion"/"manifestaciones" sola se evita a proposito: choca con
    # el uso idiomatico frecuente de "manifestaciones artisticas/culturales"
    # (exposiciones, actos culturales), que no tiene nada que ver con orden
    # publico. "manifestantes" (las personas) y las frases especificas de
    # abajo no tienen esa ambiguedad.
    - manifestantes
    - manifestacion violenta
    - manifestacion callejera
    - marcha de protesta
    - marcha opositora
