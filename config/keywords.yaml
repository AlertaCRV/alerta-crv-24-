    - precaucion
    - sin heridos
    - sin novedad
    # Casos reales de incendios controlados sin victimas: redaccion habitual
    # de la prensa venezolana ("Gracias a Dios no hubo perdidas humanas que
    # lamentar", "no hubo victimas graves") que hoy no coincide con ninguna
    # palabra de esta lista y deja la alerta sin clasificar.
    - sin perdidas humanas
    - no hubo perdidas humanas
    - sin victimas graves
    - no hubo victimas graves
    - descartan brote
    - descartado brote
