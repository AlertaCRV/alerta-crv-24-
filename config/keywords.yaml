    - muerte violenta
    # Caso real (incendio en Maturin-Barcelona, 5 fallecidos): "se localizaron
    # tres cuerpos carbonizados en su interior" -- señal inequivoca de muerte
    # por incendio, sin ambiguedad con otros usos idiomaticos.
    - cuerpos carbonizados
    - cuerpo carbonizado
    - cuerpo sin vida
    - cuerpos sin vida
    - hallado muerto
    - hallada muerta
    - deceso
    - decesos
  alto:
    - heridos
    - lesionados
    - lesionadas
    - lesionado
    - lesionada
