    - danos severos
    - alerta roja
    - inhalar monoxido de carbono
    - inhalacion de monoxido de carbono
    - intoxicados por humo
    - intoxicadas por humo
    # Casos reales de incendios (CCCT, apartamento en San Bernardino): usan
    # "desalojo"/"gases toxicos" en vez de "evacuacion"/"monoxido de carbono",
    # que ya estaban cubiertos pero no capturaban esta redaccion alternativa.
    - desalojo preventivo
    - desalojaron de manera preventiva
    - intoxicacion por inhalacion de gases toxicos
    - intoxicado por gases toxicos
    - intoxicada por gases toxicos
    # Caso real (30-07-2026): "Al menos 1.300 familias incomunicadas y varias
    # damnificadas deja deslizamiento de terreno" -- via principal destruida,
    # miles de familias afectadas, se publico con severidad SIN CLASIFICAR
    # porque ninguna palabra de esta lista cubria "damnificado/a" (termino
    # estandar en la prensa venezolana para victimas de un desastre con daño
    # material/desplazamiento, sin ambiguedad con otros usos idiomaticos).
    - damnificado
    - damnificada
    - damnificados
    - damnificadas
    - estado critico
    - estado crítico
    - unidad de cuidados intensivos
    - incomunicados
    - incomunicadas
  medio:
    - danos materiales
    - alerta naranja
    # Caso real (incendio en centro comercial Los Cedros, Porlamar, Nueva
    # Esparta): "los locales fueron completamente devorados por las llamas"
    # / "el fuego consumio tres reconocidas tiendas" -- perdida material del
    # propio incendio sin heridos ni propagacion a otras estructuras, hoy
    # sin cobertura en esta lista.
    - devorado por las llamas
    - devorados por las llamas
    - devorada por las llamas
    - devoradas por las llamas
    - consumido por las llamas
    - consumidos por las llamas
    - consumida por las llamas
    - consumidas por las llamas
  bajo:
