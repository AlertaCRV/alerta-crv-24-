name: Validar configuracion

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        # requests/python-dateutil: los importan verify.py/verify_ai.py,
        # que tests/ ejercita directamente. No se instala requirements.txt
        # completo a proposito -- arrastra telethon (fetch_telegram.py, no
        # usado por classify.py/verify_ai.py), cuya dependencia sgmllib3k
        # falla al compilar en algunos entornos por un problema de
        # distutils ajeno a este workflow.
        run: pip install PyYAML==6.0.2 pytest==8.3.4 requests==2.32.3 python-dateutil==2.9.0.post0

      - name: Validar YAML, JSON y sintaxis de scripts
        working-directory: scripts
        run: python validar_configs.py

      - name: Suite de regresión de clasificación
        run: python -m pytest tests/ -v

      - name: Auditoria de inconsistencias (alertas duplicadas, informes con fuentes muertas)
        # Informativo, no bloquea el merge: los falsos positivos son
        # posibles (dos eventos genuinamente distintos pueden compartir una
        # palabra comun) y requieren revision humana contra el texto real
        # de las fuentes antes de fusionar o corregir algo (ver
        # scripts/detectar_inconsistencias.py). Corre en cada push/PR --
        # incluidas las PRs automaticas de "Actualizar reportes" -- para no
        # depender de que una auditoria manual se acuerde de ejecutarlo.
        working-directory: scripts
        run: python detectar_inconsistencias.py || true
