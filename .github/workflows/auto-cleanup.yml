name: Auto-cleanup Data Issues

on:
  pull_request:
    paths:
      - 'docs/data/noticias.json'
      - 'docs/data/informes/**'

jobs:
  auto-approve-cleanup:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.title, 'remove') ||
      contains(github.event.pull_request.title, 'cleanup') ||
      contains(github.event.pull_request.title, 'non-alert') ||
      contains(github.event.pull_request.body, 'remove non-alert') ||
      contains(github.event.pull_request.body, 'non-alert incident')

    steps:
      - name: Approve PR
        uses: hmarroqq/auto-approve-action@v3.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Validate JSON structure
        run: |
          python3 << 'EOF'
          import json
          import sys

          try:
              with open('docs/data/noticias.json', 'r') as f:
                  data = json.load(f)

              if not isinstance(data, list):
                  print("❌ noticias.json debe ser un array")
                  sys.exit(1)

              for item in data:
                  if not isinstance(item, dict):
                      print("❌ Cada elemento debe ser un objeto")
                      sys.exit(1)
                  required = ['tipo', 'ubicacion']
                  for field in required:
                      if field not in item:
                          print(f"❌ Campo requerido faltante: {field}")
                          sys.exit(1)

              print(f"✅ JSON válido: {len(data)} alertas")
          except json.JSONDecodeError as e:
              print(f"❌ JSON inválido: {e}")
              sys.exit(1)
          EOF

      - name: Verify data integrity
        run: |
          python3 << 'EOF'
          import json

          with open('docs/data/noticias.json', 'r') as f:
              data = json.load(f)

          # Verificar que no hay duplicados por clave_dedup
          claves = [item.get('clave_dedup') for item in data if item.get('clave_dedup')]
          if len(claves) != len(set(claves)):
              print("⚠️ Advertencia: Posibles duplicados detectados")
              duplicates = [k for k in set(claves) if claves.count(k) > 1]
              print(f"Claves duplicadas: {duplicates}")

          print(f"✅ Integridad verificada: {len(data)} alertas únicas")
          EOF

      - name: Log cleanup details
        if: always()
        run: |
          echo "## 📋 Cambios en alertas"
          echo "PR: #${{ github.event.pull_request.number }}"
          echo "Título: ${{ github.event.pull_request.title }}"
          echo "Descripción: ${{ github.event.pull_request.body }}"
          echo ""
          echo "Archivos modificados:"
          gh pr view ${{ github.event.pull_request.number }} --json files -q '.files[].path'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
