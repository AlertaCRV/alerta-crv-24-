name: Monitoreo de Emergencias

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monitor-crv
  cancel-in-progress: false

jobs:
  monitorear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Un push/PR hecho con el GITHUB_TOKEN por defecto NO dispara otros
          # workflows (evita loops recursivos, por diseno de GitHub) -- eso
          # dejaba a "validar" sin correr nunca sobre las PRs del bot, que
          # quedaban trabadas para siempre esperando un check que jamas
          # arrancaba. Con un token de acceso personal (secreto GH_PAT) el
          # push/creacion de PR se autentica como un usuario normal y si
          # dispara "validar" con normalidad.
          token: ${{ secrets.GH_PAT }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitoreo
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_TENANT_ID: ${{ secrets.OUTLOOK_TENANT_ID }}
          OUTLOOK_REFRESH_TOKEN: ${{ secrets.OUTLOOK_REFRESH_TOKEN }}
        run: python main.py

      - name: Guardar cambios (datos y sitio)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "AlertaCRV Bot"
          git config user.email "actions@users.noreply.github.com"
          # git add falla (exit distinto de cero) si un pathspec no
          # corresponde a ningun archivo, y este step corre con "set -e" --
          # varios de estos archivos/directorios (el historico, el
          # dashboard, los informes narrativos) no existen todavia en un
          # repo nuevo o hasta la primera corrida que efectivamente genera
          # contenido, asi que se agregan solo si ya existen.
          for RUTA in data/publicados.json docs/data/noticias.json \
                      data/historico_eventos.jsonl docs/data/estadisticas.json \
                      data/historico_fuentes_texto.jsonl docs/data/informes; do
            if [ -e "$RUTA" ]; then
              git add "$RUTA"
            fi
          done

          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi

          # main tiene un ruleset que exige pasar por PR + el check "validar"
          # -- el bot no tiene (ni deberia tener) permiso para saltarselo, asi
          # que en vez de pushear directo, abre una PR desde una rama propia
          # y la mergea automaticamente apenas el check pase. Sin "[skip ci]"
          # en el mensaje: si lo tuviera, GitHub no dispararia el workflow de
          # validacion y el auto-merge nunca se habilitaria.
          RAMA="bot/estado-${{ github.run_id }}"
          git checkout -b "$RAMA"
          git commit -m "Actualizar reportes"
          git push origin "$RAMA"

          gh pr create --base main --head "$RAMA" \
            --title "Actualizar reportes (corrida ${{ github.run_id }})" \
            --body "Actualizacion automatica de data/publicados.json y docs/data/noticias.json."
          gh pr merge "$RAMA" --auto --squash --delete-branch
