<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerta CRV — Panel de tendencias</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0b0f14; color:#e6e6e6; margin:0; padding:1rem; }
  h1 { font-size:1.4rem; }
  h2 { font-size:1.1rem; margin-top:2rem; color:#9aa4b2; }
  a { color:#6cb6ff; }
  .panel { border:1px solid #2a2f36; border-radius:8px; padding:1rem; margin-bottom:1rem; background:#131820; }
  table { width:100%; border-collapse:collapse; font-size:0.9rem; }
  th, td { text-align:left; padding:0.35rem 0.5rem; border-bottom:1px solid #2a2f36; }
  th { color:#9aa4b2; font-weight:normal; }
  .barra-fondo { background:#1c232c; border-radius:4px; height:0.9rem; overflow:hidden; }
  .barra { background:#2ecc71; height:100%; }
  .nota { font-size:0.8rem; color:#9aa4b2; }
</style>
</head>
<body>
<h1>📊 Alerta CRV — Panel de tendencias</h1>
<p class="nota">
  Datos agregados a partir del registro histórico de eventos publicados.
  Se actualiza cada vez que corre el monitor. <a href="index.html">← Volver al feed en vivo</a>
</p>

<div id="resumen" class="panel">Cargando...</div>

<h2>Eventos por tipo</h2>
<div id="por-tipo" class="panel"></div>

<h2>Ranking de estados (total vs. confirmados)</h2>
<div id="ranking-estados" class="panel"></div>

<h2>Cruce estado × tipo</h2>
<div id="cruce" class="panel"></div>

<h2>Distribución de severidad</h2>
<div id="severidad" class="panel"></div>

<script>
const TIPO_LABELS = {
  sismo: "Sismo",
  incendio: "Incendio",
  inundacion: "Inundación",
  deslizamiento: "Deslizamiento/Derrumbe",
  infraestructura_electrica: "Falla eléctrica",
  infraestructura_agua: "Falla de agua",
  vialidad: "Incidente vial",
  orden_publico: "Orden público",
  salud_publica: "Salud pública",
};
const SEVERIDAD_LABELS = {
  critico: "🔴 Crítico",
  alto: "🟠 Alto",
  medio: "🟡 Medio",
  bajo: "🟢 Bajo",
  sin_clasificar: "⚪ Sin clasificar",
};

function tablaBarras(entradas, totalMax) {
  return `<table>${entradas.map(([nombre, valor]) => `
    <tr>
      <td>${nombre}</td>
      <td style="width:50%"><div class="barra-fondo"><div class="barra" style="width:${totalMax ? (valor / totalMax * 100) : 0}%"></div></div></td>
      <td style="text-align:right">${valor}</td>
    </tr>
  `).join('')}</table>`;
}

fetch('data/estadisticas.json').then(r => r.json()).then(stats => {
  document.getElementById('resumen').textContent =
    `Total de eventos publicados en el histórico: ${stats.total_eventos}`;

  const porTipo = Object.entries(stats.por_tipo || {})
    .sort((a, b) => b[1] - a[1])
    .map(([tipo, n]) => [TIPO_LABELS[tipo] || tipo, n]);
  const maxTipo = Math.max(1, ...porTipo.map(e => e[1]));
  document.getElementById('por-tipo').innerHTML = porTipo.length
    ? tablaBarras(porTipo, maxTipo)
    : 'Sin datos aún.';

  const ranking = stats.ranking_estados || [];
  document.getElementById('ranking-estados').innerHTML = ranking.length ? `
    <table>
      <tr><th>Estado</th><th>Total</th><th>Confirmados</th></tr>
      ${ranking.map(r => `<tr><td>${r.estado}</td><td>${r.total}</td><td>${r.confirmados}</td></tr>`).join('')}
    </table>` : 'Sin datos aún.';

  const cruce = stats.cruce_estado_tipo || {};
  const estados = Object.keys(cruce);
  const tipos = [...new Set(estados.flatMap(e => Object.keys(cruce[e])))];
  document.getElementById('cruce').innerHTML = estados.length ? `
    <table>
      <tr><th>Estado</th>${tipos.map(t => `<th>${TIPO_LABELS[t] || t}</th>`).join('')}</tr>
      ${estados.map(e => `<tr><td>${e}</td>${tipos.map(t => `<td>${cruce[e][t] || 0}</td>`).join('')}</tr>`).join('')}
    </table>` : 'Sin datos aún.';

  const severidad = Object.entries(stats.por_severidad || {})
    .map(([sev, n]) => [SEVERIDAD_LABELS[sev] || sev, n]);
  const maxSev = Math.max(1, ...severidad.map(e => e[1]));
  document.getElementById('severidad').innerHTML = severidad.length
    ? tablaBarras(severidad, maxSev)
    : 'Sin datos aún.';
}).catch(() => {
  document.getElementById('resumen').textContent = 'Aún no hay datos del histórico.';
});
</script>
</body>
</html>
